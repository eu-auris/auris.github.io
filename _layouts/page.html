---
layout: default
---
<div class="page-hero">
  <div class="container">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <ol>
        <li><a href="{{ '/' | relative_url }}">Home</a></li>
        <li><span aria-current="page">{{ page.title }}</span></li>
      </ol>
    </nav>
    <h1 class="page-hero__title">{{ page.title }}</h1>
    {%- if page.lead %}
    <p class="page-hero__lead">{{ page.lead }}</p>
    {%- endif %}
  </div>
</div>

<div class="page-body">
  {{ content }}
</div>
