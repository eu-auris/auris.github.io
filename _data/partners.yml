# -----------------------------------------------------------------------------
# Consortium members (source: proposal, "List of participating organisations").
#   type: beneficiary | associated     (associated = associated partner)
#   sector: academic | non-academic
#   awards_doctorate: true when the organisation awards doctoral degrees
#   coordinator: true for the coordinating beneficiary (only one)
#   logo: path under /assets/images/partners/ ("" → the short name is shown instead)
#   logo_on_dark: true when the logo is white and needs a dark tile
#   logo2: optional second logo (e.g. joint team of two institutions)
#   city: "" hides the city. Cities marked "# check" come from public company
#         registries, not from the proposal — please confirm them.
# -----------------------------------------------------------------------------

